services:
  - type: web
    name: ox-mining-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ox-mining-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ox-mining-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://ox-mining-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://ox-mining-api.onrender.com,https://t.me
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: FIRST_ADMIN_TELEGRAM_ID
        sync: false
      - key: MONETAG_PUBLISHER_ID
        sync: false
      - key: MONETAG_ZONE_ID_REWARDED
        sync: false
      - key: MONETAG_ZONE_ID_POPUP
        sync: false
      - key: MONETAG_SECRET_KEY
        sync: false

  - type: worker
    name: ox-mining-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ox-mining-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ox-mining-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: ox-mining-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: ox-mining-api
          envVarKey: JWT_SECRET_KEY

  - type: worker
    name: ox-mining-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ox-mining-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ox-mining-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: ox-mining-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: ox-mining-api
          envVarKey: JWT_SECRET_KEY

  - type: web
    name: ox-mining-bot
    runtime: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ox-mining-api
          property: host

  - type: keyvalue
    name: ox-mining-redis
    plan: free

databases:
  - name: ox-mining-db
    databaseName: miningdb
    user: mininguser
