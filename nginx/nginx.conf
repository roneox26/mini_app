events {
    worker_connections 4096;  # Increased from 1024 for high traffic
    use epoll;  # Better event loop for Linux
    multi_accept on;  # Accept multiple connections
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;  # Optimize TCP behavior
    tcp_nodelay on;  # Reduce latency
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;  # Balance compression vs CPU
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';

    access_log /var/log/nginx/access.log main buffer=32k;
    error_log /var/log/nginx/error.log warn;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Cache
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache:10m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # Rate limiting zones - more generous
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;  # Increased from 30
    limit_req_zone $binary_remote_addr zone=auth:10m rate=50r/m;  # Increased from 10
    limit_req_zone $http_x_forwarded_for zone=api_proxy:10m rate=100r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    upstream backend {
        # Load balancing with health check
        server backend:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;  # Reuse connections
    }

    upstream bot {
        server bot:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Frontend (Telegram Mini App)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options SAMEORIGIN;
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy strict-origin-when-cross-origin;
        }

        # Admin Panel
        location /admin/ {
            alias /usr/share/nginx/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            # Restrict to known IPs in production:
            # allow 1.2.3.4;
            # deny all;
        }

        # API Proxy
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_conn addr 100;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Performance
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Cache GET requests only
            proxy_cache cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 5m;
            proxy_cache_bypass $http_cache_control;
            proxy_no_cache $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Auth endpoint — stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_conn addr 50;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # No caching for auth
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Bot Webhook
        location /webhook {
            proxy_pass http://bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
            access_log off;
        }
    }

    # HTTPS server (uncomment for production with SSL cert)
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     # ... same location blocks as above
    # }
}
